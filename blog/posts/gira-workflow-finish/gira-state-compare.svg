<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Gira expected and actual state comparison</title>
  <desc id="desc">A diagram showing Gira comparing expected work state with actual GitHub state before applying a finish transition.</desc>
  <rect width="1200" height="675" fill="#f2f1ec"/>
  <rect x="66" y="56" width="1068" height="563" rx="28" fill="#171717"/>
  <text x="104" y="122" fill="#f2f1ec" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Read, compare, then finish</text>
  <text x="104" y="164" fill="#cfcabf" font-family="Inter, Arial, sans-serif" font-size="22">A finish command should inspect GitHub state before it writes the final transition.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="104" y="224" width="292" height="294" rx="22" fill="#eee9dc"/>
    <text x="134" y="270" fill="#171717" font-size="26" font-weight="700">Expected state</text>
    <g fill="#171717" font-size="21">
      <text x="134" y="326">issue: closed</text>
      <text x="134" y="372">pr: merged</text>
      <text x="134" y="418">checks: passed</text>
      <text x="134" y="464">label: done</text>
    </g>

    <rect x="452" y="250" width="296" height="242" rx="22" fill="#9fd0b3"/>
    <text x="600" y="314" text-anchor="middle" fill="#171717" font-size="27" font-weight="700">gira ticket finish</text>
    <text x="600" y="358" text-anchor="middle" fill="#171717" font-size="21">--dry-run</text>
    <line x1="510" y1="402" x2="690" y2="402" stroke="#171717" stroke-width="3" stroke-linecap="round"/>
    <text x="600" y="444" text-anchor="middle" fill="#171717" font-size="20">read -> compare -> apply</text>

    <rect x="804" y="224" width="292" height="294" rx="22" fill="#d6e0e2"/>
    <text x="834" y="270" fill="#171717" font-size="26" font-weight="700">Actual GitHub state</text>
    <g fill="#171717" font-size="21">
      <text x="834" y="326">issue: closed</text>
      <text x="834" y="372">pr: merged</text>
      <text x="834" y="418">checks: passed</text>
      <text x="834" y="464">label: in-progress</text>
    </g>

    <g stroke="#f2f1ec" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M396 370 H452"/>
      <path d="M748 370 H804"/>
    </g>

    <rect x="786" y="445" width="258" height="42" rx="21" fill="#f3d7c2"/>
    <text x="915" y="472" text-anchor="middle" fill="#171717" font-size="18" font-weight="700">drift detected</text>

    <text x="104" y="574" fill="#f2f1ec" font-size="20" font-weight="700">The useful part is not automatic closing. It is noticing what still disagrees.</text>
  </g>
</svg>
