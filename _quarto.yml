project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "blog/**/*.qmd"
    - "docs/**/*.qmd"
    - "macro/**/*.qmd"
  resources:
    - CNAME

website:
  title: "StatPan"
  site-url: https://statpan.com
  description: "AI & Data Infra, For Agents"
  google-analytics: "G-T89ZMSEYS4"
  open-graph: true
  twitter-card: true
  navbar:
    background: dark
    foreground: light
    left:
      - href: index.qmd
        text: Home
      - href: macro/index.qmd
        text: Macro
      - href: blog/index.qmd
        text: Blog
    right:
      - icon: github
        href: https://github.com/StatPan
        aria-label: GitHub
  page-footer:
    center: |
      &copy; 2026 StatPan. All rights reserved.

format:
  html:
    theme:
      dark: [darkly, custom.scss]
    css: styles.css
    toc: true
